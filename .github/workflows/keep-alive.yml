name: Keep Supabase Projects Alive

on:
  schedule:
    # 每 3 天的台灣時間早上 09:00 自動執行（遠低於 7 天休眠限制）
    - cron: '0 1 */3 * *'
  workflow_dispatch: # 允許隨時在 GitHub 網頁手動點擊測試

jobs:
  wake-up-databases:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 喚醒【生活基金 & 旅遊分帳】資料庫
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_nd4tk7NvjvEUPXUDcfDz5A_c8spPJU_" \
            -H "Authorization: Bearer sb_publishable_nd4tk7NvjvEUPXUDcfDz5A_c8spPJU_" \
            "https://gydznvocncuqhjofeyzc.supabase.co/rest/v1/")
          echo "專案 1 回應狀態碼: $STATUS"
          if [ "$STATUS" -ge 400 ]; then exit 1; fi

